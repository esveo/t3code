# Fork-only: every morning a Copilot agent merges upstream's main into `fork`,
# resolves conflicts, verifies the result and pushes it. What it cannot resolve
# becomes an issue assigned to the maintainer instead. See FORK.md.
#
# Needs the repo secret SYNC_PUSH_TOKEN: a fine-grained token for esveo/t3code
# with Contents and Workflows read/write (upstream merges touch
# .github/workflows, which the Actions token may not push). Copilot usage is
# billed to the org through `copilot-requests: write`.
name: Fork upstream sync

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: Europe/Berlin
  workflow_dispatch:

concurrency:
  group: fork-upstream-sync
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: write
  copilot-requests: write

env:
  MAINTAINER: Pawl-Patrol

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          ref: fork
          fetch-depth: 0
          token: ${{ secrets.SYNC_PUSH_TOKEN }}

      - name: Check for new upstream commits
        id: upstream
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream main
          behind=$(git rev-list --count fork..upstream/main)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "fork is $behind commits behind upstream/main"

      - name: Setup Vite+
        if: steps.upstream.outputs.behind != '0'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Prepare agent
        if: steps.upstream.outputs.behind != '0'
        run: |
          vp run --filter @t3tools/desktop ensure:electron
          npm install -g @github/copilot
          git config user.name "t3code upstream sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git ls-files .github/workflows > "$RUNNER_TEMP/workflows-before.txt"

      - name: Merge, resolve and push
        if: steps.upstream.outputs.behind != '0'
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/prompt.md" <<EOF
          You maintain esveo/t3code, a private fork of T3 Code. Your job: merge upstream's
          main into the branch \`fork\` and push it. You are already on \`fork\`, and
          \`upstream/main\` is fetched ($(git rev-list --count fork..upstream/main) new commits).
          Read FORK.md (rules of this fork) and README.md (the fork's features) first.

          1. Run \`git merge --no-ff --no-edit upstream/main\`. The result must stay a real
             merge commit with upstream/main as second parent: never rebase, squash,
             reset \`fork\`, or push with --force.
          2. Resolve every conflict yourself. Take upstream's change and keep the fork's
             feature working on top of it. Before deciding, read both sides and the commit
             that introduced the fork's side (\`git log fork -- <file>\`). Do not hand-merge
             pnpm-lock.yaml: resolve package.json files, then regenerate it with \`vp i\`.
          3. Verify: \`vp i\`, then \`vpr typecheck\`, then \`vp test run <files>\` for the tests
             next to every file you resolved or fixed. Fix what the merge broke, and commit
             fixes as separate commits after the merge commit.
          4. When the merge is committed and typecheck and those tests are green, run
             \`git push origin fork\`. If the push is rejected because \`fork\` moved, run
             \`git pull --no-rebase origin fork\`, verify again and push again.
          5. List workflow files upstream added:
             \`git ls-files .github/workflows | grep -vxFf $RUNNER_TEMP/workflows-before.txt\`.
             Right after pushing, disable each one with \`gh workflow disable <file name>\`:
             the fork runs none of upstream's workflows.

          If you cannot resolve a conflict with confidence (for example upstream rebuilt
          the code a fork feature depends on) or typecheck/tests stay red after honest
          attempts: do not push, and do not drop or disable fork features to get green.
          Instead run \`gh issue create --assignee $MAINTAINER --label upstream-sync\` with
          the title "Upstream sync needs help ($(date +%F))" and a body that names each open
          conflict or failure, what you tried, and the options you see. Then stop.

          Finish with a short summary: pushed or issue created, the conflicts you resolved
          and how.
          EOF
          copilot --no-ask-user --allow-all-tools --allow-all-paths -p "$(cat "$RUNNER_TEMP/prompt.md")"

      # The agent either lands upstream in `fork` or opens an issue; anything else
      # fails the run so the step below reports it.
      - name: Check the result
        if: steps.upstream.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin fork
          git merge-base --is-ancestor upstream/main origin/fork && exit 0
          reported=$(gh issue list --label upstream-sync --state open --search "created:>=$(date +%F)" --json number --jq 'length')
          [ "$reported" != "0" ] && exit 0
          echo "The agent neither pushed the merge nor opened an issue."
          exit 1

      - name: Report a failed run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --assignee "$MAINTAINER" --label upstream-sync \
            --title "Upstream sync failed ($(date +%F))" \
            --body "The sync run failed before it could finish: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
