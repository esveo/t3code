# Fork-only: merges upstream's main (DEFAULT_UPSTREAM_REF) into `fork` (see
# FORK.md).
#
# `merge` runs upstream's code and the Copilot CLI, so it holds no token that
# can write: it merges, lets Copilot resolve conflicts and fix what broke, and
# hands the result on as a git bundle. `publish` never runs that code: it checks
# the bundle, pushes it as a PR and merges the PR when every check was green,
# otherwise leaves it as a draft for the maintainer. The fixed checks live in
# .github/scripts/fork-upstream-sync.sh and always run from the fork commit the
# sync started on, so the merge cannot change them.
#
# Copilot is billed to the org through `copilot-requests: write`. Pushing needs
# the repo secret SYNC_MERGE_TOKEN: a fine-grained token for esveo/t3code with
# Contents, Pull requests and Workflows read/write (upstream merges touch
# .github/workflows, which the Actions token may not push).
name: Fork upstream sync

on:
  schedule:
    # 06:00 in Germany during summer time, 05:00 in winter (cron runs in UTC).
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream branch or commit to merge (an older commit merges a backlog in stages)
        default: main
      dry_run:
        description: Leave the PR as a draft even when everything is green
        type: boolean
        default: false
      max_ai_credits:
        description: Copilot's budget for this run in AI credits (1 credit = $0.01); a large backlog needs more
        default: "300"
      model:
        description: Copilot model for this run
        default: gpt-5.6-sol

concurrency:
  group: fork-upstream-sync
  cancel-in-progress: false

permissions: {}

env:
  MAINTAINER: Pawl-Patrol
  DEFAULT_UPSTREAM_REF: main
  SCRIPT: .github/scripts/fork-upstream-sync.sh

jobs:
  merge:
    if: github.repository == 'esveo/t3code'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      copilot-requests: write
    outputs:
      behind: ${{ steps.upstream.outputs.behind }}
      fork_sha: ${{ steps.upstream.outputs.fork_sha }}
      target: ${{ steps.upstream.outputs.target }}
      green: ${{ steps.verdict.outputs.green }}
      bundled: ${{ steps.verdict.outputs.bundled }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          ref: fork
          fetch-depth: 0
          persist-credentials: false

      - name: Find the upstream commit
        id: upstream
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref || env.DEFAULT_UPSTREAM_REF }}
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream "$UPSTREAM_REF"
          fork_sha=$(git rev-parse HEAD)
          target=$(git rev-parse FETCH_HEAD)
          behind=$(git rev-list --count "$fork_sha..$target")
          echo "fork is $behind commits behind upstream $UPSTREAM_REF ($target)"
          {
            echo "FORK_SHA=$fork_sha"
            echo "TARGET=$target"
            echo "SYNC_DIR=$RUNNER_TEMP/sync"
          } >> "$GITHUB_ENV"
          {
            echo "behind=$behind"
            echo "fork_sha=$fork_sha"
            echo "target=$target"
          } >> "$GITHUB_OUTPUT"

      - name: Restore conflict resolutions
        if: steps.upstream.outputs.behind != '0'
        uses: actions/cache/restore@v4
        with:
          path: .git/rr-cache
          key: fork-sync-rerere-${{ github.run_id }}
          restore-keys: fork-sync-rerere-

      - name: Setup Vite+
        if: steps.upstream.outputs.behind != '0'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Merge
        id: merge
        if: steps.upstream.outputs.behind != '0'
        run: |
          git config user.name "t3code upstream sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if bash <(git show "$FORK_SHA:$SCRIPT") merge; then
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the plain merge
        id: plain
        if: steps.merge.outputs.conflicts == 'false'
        continue-on-error: true
        run: bash <(git show "$FORK_SHA:$SCRIPT") verify

      # The models the org lets this token use; a --model outside them fails at once.
      - name: List Copilot models
        if: steps.merge.outputs.conflicts == 'true' || steps.plain.outcome == 'failure'
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsS https://api.githubcopilot.com/models \
            -H "Authorization: Bearer $COPILOT_GITHUB_TOKEN" \
            -H "Copilot-Integration-Id: copilot-developer-cli" |
            jq -r '.data[] | select(.model_picker_enabled) | "\(.id)\t\(.policy.state // "-")"' |
            tee "$SYNC_DIR/models.txt"

      - name: Let Copilot resolve and fix
        id: agent
        if: steps.merge.outputs.conflicts == 'true' || steps.plain.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 90
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          MAX_AI_CREDITS: ${{ inputs.max_ai_credits || '300' }}
          MODEL: ${{ inputs.model || 'gpt-5.6-sol' }}
        run: |
          npm install -g @github/copilot
          cat > "$RUNNER_TEMP/prompt.md" <<EOF
          You maintain esveo/t3code, a fork of T3 Code (pingdotgg/t3code). Upstream's
          ${{ inputs.upstream_ref || env.DEFAULT_UPSTREAM_REF }} is being merged into the fork's branch \`fork\`, and your job is to
          finish that merge so that every fork feature keeps working on top of
          upstream. Read FORK.md (rules of this fork) and README.md (its features) first.

          State: HEAD is \`fork\` ($FORK_SHA) merging upstream $TARGET.
          $(if [ -s "$SYNC_DIR/conflicts.txt" ]; then
              echo "The merge stopped with conflicts in:"
              sed 's/^/- /' "$SYNC_DIR/conflicts.txt"
            else
              echo "The merge is committed but its checks failed; see $SYNC_DIR/*.md and $SYNC_DIR/checks.log."
            fi)

          1. Resolve every conflict. Take upstream's change and keep the fork's
             feature working on top of it. Read both sides and the commits behind
             them (\`git log $FORK_SHA -- <file>\`, \`git log $FORK_SHA..$TARGET -- <file>\`).
             Do not hand-merge pnpm-lock.yaml: resolve the package.json files, take
             the fork's lockfile (\`git checkout --ours pnpm-lock.yaml\`), regenerate
             it with \`vp install --no-frozen-lockfile\` and commit it.
          2. Commit the merge with \`git commit --no-edit\`. It must stay a merge
             commit of $FORK_SHA and $TARGET: never rebase, reset, squash or amend
             past it. Commit every later fix as a separate commit on top.
          3. Verify with \`bash <(git show $FORK_SHA:$SCRIPT) verify\`. It installs,
             typechecks, runs the tests related to the files both sides changed and
             checks the merge's shape. Its reports land in $SYNC_DIR: checks.md,
             checks.log, guards.md and audit.md. audit.md lists lines the fork added
             that the result lost; restore every one that belongs to a fork feature,
             and adapt it to upstream's new code where upstream rewrote it.
             Fix what fails and verify again until it passes.

          Rules: do not change anything under .github (the sync is refused if you
          do); do not delete, skip or weaken tests or fork features to get green;
          do not push, and do not use gh. Your budget is $MAX_AI_CREDITS AI credits
          and the session ends without warning when it runs out, so commit as you
          go. When done or stuck, and early enough to still have budget, write
          $SYNC_DIR/summary.md: the conflicts and how you resolved each, the fixes
          you made, what remains open and the options you see. If you cannot
          finish with confidence (for example upstream rebuilt the code a fork
          feature depends on) or verify stays red after honest attempts, write
          "blocked" to $SYNC_DIR/status and commit what you have, conflict
          markers included, so the maintainer can pick it up from there.

          The runner has limited memory: run typecheck, tests, installs and builds
          one at a time, never in parallel with each other, and never from several
          sub-agents at once.
          EOF
          git rev-parse HEAD > "$SYNC_DIR/head-before"
          git status --porcelain > "$SYNC_DIR/status-before"
          copilot -p "$(cat "$RUNNER_TEMP/prompt.md")" \
            --model "$MODEL" \
            --no-ask-user --allow-all-tools --allow-all-paths \
            --deny-tool 'shell(git push)' --deny-tool 'shell(gh)' \
            --secret-env-vars=COPILOT_GITHUB_TOKEN \
            --max-ai-credits "$MAX_AI_CREDITS" \
            --share "$SYNC_DIR/transcript.md" \
            --usage-output-file "$SYNC_DIR/usage.json"

      # Everything below runs even when the runner cancelled the Copilot step (as
      # it did once after 8 minutes, without a manual cancel), so the work done
      # so far still lands as a draft PR or at least as the artifact.
      - name: Check that Copilot ran
        id: ran
        if: always() && (steps.agent.outcome == 'failure' || steps.agent.outcome == 'cancelled')
        run: |
          free -m
          sudo dmesg 2>/dev/null | grep -iE 'out of memory|oom-kill|killed process' | tail -5 || true
          # A Copilot that never started (model not enabled, auth refused) leaves
          # only the conflicted merge: fail the run instead of opening a PR of it.
          if [ "$(git rev-parse HEAD)" = "$(cat "$SYNC_DIR/head-before" 2>/dev/null)" ] &&
            [ "$(git status --porcelain)" = "$(cat "$SYNC_DIR/status-before" 2>/dev/null)" ]; then
            echo "::error::Copilot changed nothing; see the step above."
            exit 1
          fi

      - name: Commit what the agent left
        if: always() && steps.agent.outcome != 'skipped' && steps.ran.outcome != 'failure'
        run: |
          rm -f .git/index.lock
          if [ "${{ steps.agent.outcome }}" = cancelled ]; then echo blocked > "$SYNC_DIR/status"; fi
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            echo blocked > "$SYNC_DIR/status"
            git add -A
            git commit --no-edit
          elif [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: changes the upstream sync left uncommitted"
          fi

      - name: Verify the agent's result
        id: fixed
        if: "!cancelled() && steps.agent.outcome != 'skipped' && steps.ran.outcome != 'failure'"
        continue-on-error: true
        run: bash <(git show "$FORK_SHA:$SCRIPT") verify

      - name: Verdict
        id: verdict
        if: always() && steps.merge.outcome == 'success' && steps.ran.outcome != 'failure'
        run: |
          green=false
          if [ "${{ steps.plain.outcome }}" = success ]; then green=true; fi
          if [ "${{ steps.fixed.outcome }}" = success ] && [ "$(cat "$SYNC_DIR/status" 2>/dev/null)" != blocked ]; then green=true; fi
          echo "green=$green" >> "$GITHUB_OUTPUT"
          git branch -f sync HEAD
          git bundle create "$SYNC_DIR/sync.bundle" sync "^$FORK_SHA"
          echo "bundled=true" >> "$GITHUB_OUTPUT"

      - name: Save conflict resolutions
        if: always() && steps.verdict.outputs.green == 'true'
        uses: actions/cache/save@v4
        with:
          path: .git/rr-cache
          key: fork-sync-rerere-${{ github.run_id }}

      - name: Upload the result
        if: always() && steps.upstream.outputs.behind != '0'
        uses: actions/upload-artifact@v4
        with:
          name: sync
          path: ${{ runner.temp }}/sync
          include-hidden-files: true

  publish:
    needs: merge
    # Also after a failed merge job, as long as it bundled a result.
    if: "!cancelled() && needs.merge.outputs.bundled == 'true'"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      FORK_SHA: ${{ needs.merge.outputs.fork_sha }}
      TARGET: ${{ needs.merge.outputs.target }}
      GREEN: ${{ needs.merge.outputs.green }}
      DRY_RUN: ${{ inputs.dry_run }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          ref: fork
          fetch-depth: 0
          token: ${{ secrets.SYNC_MERGE_TOKEN }}

      - name: Download the result
        uses: actions/download-artifact@v4
        with:
          name: sync
          path: ${{ runner.temp }}/sync

      # Guards and audit again, now outside the job the agent ran in.
      - name: Check the result
        id: check
        run: |
          echo "SYNC_DIR=$RUNNER_TEMP/sync" >> "$GITHUB_ENV"
          export SYNC_DIR=$RUNNER_TEMP/sync
          git fetch "$SYNC_DIR/sync.bundle" sync:sync
          git checkout -q sync
          bash <(git show "$FORK_SHA:$SCRIPT") workflows
          ok=true
          bash <(git show "$FORK_SHA:$SCRIPT") guards || ok=false
          bash <(git show "$FORK_SHA:$SCRIPT") audit || ok=false
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.SYNC_MERGE_TOKEN }}
          CHECK_OK: ${{ steps.check.outputs.ok }}
        run: |
          branch="sync/upstream-$(date +%F)-${{ github.run_id }}"
          git push origin "sync:refs/heads/$branch"
          short=$(git rev-parse --short "$TARGET")
          ready=false
          [ "$GREEN" = true ] && [ "$CHECK_OK" = true ] && ready=true
          {
            echo "Merges upstream's ${{ inputs.upstream_ref || env.DEFAULT_UPSTREAM_REF }} up to [\`$short\`](https://github.com/pingdotgg/t3code/commit/$TARGET) into \`fork\` ($(git rev-list --count "$FORK_SHA..$TARGET") new commits). [Sync run]($RUN_URL)"
            echo
            if [ "$ready" = true ]; then
              echo "Everything is green; the sync merges this itself."
            else
              echo "@$MAINTAINER this sync needs you: see the red items below and the run's \`sync\` artifact (Copilot's transcript)."
            fi
            if [ -s "$SYNC_DIR/conflicts.txt" ]; then
              echo
              echo "## Conflicts"
              sed 's/^/- `/; s/$/`/' "$SYNC_DIR/conflicts.txt"
            fi
            if [ -s "$SYNC_DIR/summary.md" ]; then
              echo
              echo "## Copilot's summary"
              echo
              cat "$SYNC_DIR/summary.md"
            elif [ -s "$SYNC_DIR/transcript.md" ]; then
              echo
              echo "## Copilot's last words"
              echo
              echo "Copilot wrote no summary, most likely because its budget ran out. The end of its transcript:"
              echo
              awk '/^### Copilot$/ { buf = ""; keep = 1; next } /^### / { keep = 0 } keep { buf = buf $0 "\n" } END { printf "%s", buf }' \
                "$SYNC_DIR/transcript.md" | sed '/^---$/,$d' | sed 's/^/> /'
            fi
            for f in checks guards audit; do
              [ -s "$SYNC_DIR/$f.md" ] && { echo; cat "$SYNC_DIR/$f.md"; }
            done
          } | head -c 60000 > "$RUNNER_TEMP/body.md"
          draft=()
          [ "$ready" = true ] && [ "$DRY_RUN" != true ] || draft=(--draft)
          url=$(gh pr create --base fork --head "$branch" "${draft[@]}" \
            --title "chore: merge upstream/${{ inputs.upstream_ref || env.DEFAULT_UPSTREAM_REF }} ($short)" --body-file "$RUNNER_TEMP/body.md")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          # A green sync supersedes older ones; a red one leaves them for comparison.
          [ "$ready" = true ] || exit 0
          for old in $(gh pr list --base fork --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"sync/upstream-\")) | select(.headRefName != \"$branch\") | .number"); do
            gh pr close "$old" --delete-branch --comment "Superseded by $url"
          done

      - name: Merge the pull request
        if: steps.pr.outputs.ready == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.SYNC_MERGE_TOKEN }}
        run: gh pr merge "${{ steps.pr.outputs.url }}" --merge --delete-branch

      # The fork runs none of upstream's workflows; switch off any the merge added.
      - name: Disable workflows upstream added
        if: steps.pr.outputs.ready == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          added=$(gh workflow list --json path,state --jq '.[] | select(.state == "active") | .path' |
            grep '^\.github/workflows/' | grep -v -e '/fork-' -e '/copilot-setup-steps\.yml$' || true)
          for path in $added; do gh workflow disable "$(basename "$path")"; done

  report:
    needs: [merge, publish]
    if: failure() && needs.publish.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Report a failed run
        run: |
          gh label create upstream-sync --color 5319e7 --description "Automatic upstream sync" --force
          gh issue create --assignee "$MAINTAINER" --label upstream-sync \
            --title "Upstream sync failed ($(date +%F))" \
            --body "The sync run failed before it could open a pull request: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
