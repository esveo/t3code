# Fork-only: builds the esveo code Android APK (apps/mobile/esveo.config.ts) from `fork` and
# publishes it as a GitHub release tagged with its versionName, which Obtainium on the phones
# watches for updates. The APK is signed with the keystore in the repo secrets
# ESVEO_ANDROID_KEYSTORE (base64) and ESVEO_ANDROID_KEYSTORE_PASSWORD; Android only installs an
# update signed with the same key, so never replace them.
name: Fork Android APK

on:
  push:
    branches: [fork]
    paths:
      - apps/mobile/**
      - packages/client-runtime/**
      - packages/contracts/**
      - packages/shared/**
      - patches/**
      - pnpm-lock.yaml
      - scripts/fork/build-esveo-apk.sh
      - .github/workflows/fork-android-apk.yml
  workflow_dispatch:

concurrency:
  group: fork-android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Upstream's public release config, the same the desktop release binaries carry.
      T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
      T3CODE_CLERK_JWT_TEMPLATE: t3-relay
      T3CODE_RELAY_URL: https://relay.t3.codes
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The versionCode is the commit count.
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Restore keystore
        env:
          KEYSTORE: ${{ secrets.ESVEO_ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ESVEO_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "The keystore secrets are missing; a new key could not update installed apps." >&2
            exit 1
          fi
          echo "T3CODE_FORK_APP_ROOT=$RUNNER_TEMP/esveo" >> "$GITHUB_ENV"
          export T3CODE_FORK_APP_ROOT="$RUNNER_TEMP/esveo"
          mkdir -p "$T3CODE_FORK_APP_ROOT/android"
          echo "$KEYSTORE" | base64 -d > "$T3CODE_FORK_APP_ROOT/android/esveo-code.keystore"
          printf '%s' "$KEYSTORE_PASSWORD" > "$T3CODE_FORK_APP_ROOT/android/esveo-code.keystore.password"

      - name: Build APK
        id: build
        run: |
          set -o pipefail
          apk="$(scripts/fork/build-esveo-apk.sh | tail -1)"
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          version="$("$aapt2" dump badging "$apk" | sed -nE "s/.*versionName='([^']+)'.*/\1/p")"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.build.outputs.apk }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION exists already."
            exit 0
          fi
          cp "$APK" "esveo-code-$VERSION.apk"
          gh release create "$VERSION" "esveo-code-$VERSION.apk" \
            --target "$GITHUB_SHA" --latest \
            --title "esveo code $VERSION" \
            --notes "esveo code for Android, built from \`fork\` at $GITHUB_SHA."
